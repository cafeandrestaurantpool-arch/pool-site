# main に push されるたびに、site/ を GitHub Pages に公開する（回数制限なし）。
# リンクは tools/pages_fix.py が GitHub Pages 用に書きかえる（site/ そのものは変えない）。
# 公開のしかた：できあがったページを gh-pages ブランチに置く（GitHub が自動で公開する）。
# ※ リポジトリの Pages 設定が「gh-pages ブランチ」になっているため、この方式にしている（2026-11-03）。
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site for GitHub Pages
        run: |
          cp -r site _pages
          python3 tools/pages_fix.py _pages pool-site
          printf '%s' f5583eafcedf018d704433ef65b0ce92 > _pages/f5583eafcedf018d704433ef65b0ce92.txt  # IndexNow の鍵
          mkdir site_for_indexnow && cp _pages/sitemap.xml site_for_indexnow/
      - name: Push to gh-pages branch
        run: |
          cd _pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "公開：${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Notify search engines (IndexNow)
        run: |
          sleep 120  # GitHub Pages が公開し終わるのを待つ
          python3 tools/indexnow.py site_for_indexnow https://cafeandrestaurantpool-arch.github.io/pool-site/ || true
